<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>F1 Shakedown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; overflow: hidden;">
    <div id="hud">
        <div id="telemetry">
            <div id="speed">0 km/h</div>
            <div id="lap-time">00:00.000</div>
            <div id="gear">N</div>
        </div>
    </div>

    <div id="menu" class="overlay">
        <h1 style="color: #e10600; font-style: italic; font-size: 4rem; text-align: center;">F1 SHAKEDOWN</h1>
        <button id="btn-start" style="padding: 1rem 3rem; font-size: 1.5rem; background: #e10600; color: white; border: none; cursor: pointer; border-radius: 5px;">LARGAR</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <!-- Error Handler for Online Debugging -->
    <script>
        window.onerror = function(msg, url, line) {
            console.error("ERROR:", msg, "at", url, "line", line);
            return false;
        };
    </script>

    <!-- Use a more compatible import map for GitHub Pages -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
